<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Golf Tracker v3</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<div class="logo">

<h1>
Golf Tracker v3
</h1>

<span class="subtitle">
Golf Canada Handicap Tracker
</span>

</div>


<div class="header-right">

<button id="refreshBtn">
Refresh Data
</button>

</div>

</header>




<nav class="main-nav">


<button data-section="dashboard" class="nav-btn active">
Dashboard
</button>


<button data-section="history" class="nav-btn">
Round History
</button>


<button data-section="analysis" class="nav-btn">
Analysis
</button>


<button data-section="solver" class="nav-btn">
Solver
</button>


<button data-section="timemachine" class="nav-btn">
Time Machine
</button>


<button data-section="charts" class="nav-btn">
Charts
</button>


</nav>





<main id="app">



<section
id="dashboard"
class="page app-section active">


<div class="player-grid">



<div class="player-card">

<h2>
Mike
</h2>


<div
class="bigHandicap"
id="mikeHandicap">

--

</div>


<div id="mikeSummary"></div>


</div>





<div class="player-card">

<h2>
Johnny
</h2>


<div
class="bigHandicap"
id="johnnyHandicap">

--

</div>


<div id="johnnySummary"></div>


</div>



</div>





<div
id="dashboardStats"
class="dashboard-grid">

</div>



</section>







<section
id="history"
class="page app-section active">


<h2>
Round History
</h2>


<div id="historyTable"></div>


</section>








<section
id="analysis"
class="page app-section active">


<h2>
Handicap Analysis
</h2>


<div id="analysisContainer"></div>


</section>








<section
id="solver"
class="page app-section active">


<h2>
Target Handicap Solver
</h2>



<div class="solver-controls">


<label>

Player

<select id="solverPlayer">

<option>
Mike
</option>

<option>
Johnny
</option>

</select>

</label>




<label>

Target Handicap

<input
type="number"
step="0.1"
id="targetHandicap">

</label>




<button id="runSolver">

Calculate

</button>


</div>



<div id="solverResults"></div>


</section>








<section
id="timemachine"
class="page app-section active">


<h2>
Time Machine
</h2>



<div class="time-controls">


<button id="previousRound">

◀

</button>



<span id="timeRoundLabel">

Round

</span>



<button id="nextRound">

▶

</button>



</div>



<div id="timeMachineResults"></div>



</section>








<section
id="charts"
class="page app-section">


<h2>
Handicap Trend Charts
</h2>


<div class="card">


<label>

Select Player:

<select id="chartPlayer">

<option value="Mike">
Mike
</option>


<option value="Johnny">
Johnny
</option>


</select>

</label>



<div id="chartStats"
style="margin-top:20px;">

</div>



<canvas
id="handicapChart"
width="1200"
height="500">
</canvas>



</div>


</section>






</main>






<div
id="loading"
class="loading hidden">

Loading...

</div>





<script src="config.js"></script>
<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="csv.js"></script>
<script src="whs.js"></script>
<script src="handicap.js"></script>
<script src="dashboard.js"></script>
<script src="history.js"></script>
<script src="analysis.js"></script>
<script src="solver.js"></script>
<script src="timemachine.js"></script>
<script src="charts.js"></script>
<script src="ui.js"></script>
<script src="integration.js"></script>
<script src="validation.js"></script>
<script src="export.js"></script>
<script src="mobile.js"></script>
<script src="audit.js"></script>
<script src="trend.js"></script>

<script src="app.js"></script>


</body>

</html>
