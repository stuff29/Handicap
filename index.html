<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Golf Tracker v3</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">

        <h1>Golf Tracker v3</h1>

        <span class="subtitle">
            Golf Canada Handicap Tracker
        </span>

    </div>

    <div class="header-right">

        <button id="refreshBtn">
            Refresh Data
        </button>

    </div>

</header>

<nav class="main-nav">

<button data-page="dashboard" class="nav-btn active">
Dashboard
</button>

<button data-page="history" class="nav-btn">
Round History
</button>

<button data-page="analysis" class="nav-btn">
Analysis
</button>

<button data-page="solver" class="nav-btn">
Solver
</button>

<button data-page="timemachine" class="nav-btn">
Time Machine
</button>

<button data-page="charts" class="nav-btn">
Charts
</button>

</nav>

<main id="app">

<section
id="dashboard"
class="page active">

<div class="player-grid">

<div class="player-card">

<h2>Mike</h2>

<div class="bigHandicap"
id="mikeHandicap">
--
</div>

<div id="mikeSummary"></div>

</div>

<div class="player-card">

<h2>Johnny</h2>

<div class="bigHandicap"
id="johnnyHandicap">
--
</div>

<div id="johnnySummary"></div>

</div>

</div>

<div
id="dashboardStats"
class="dashboard-grid">
</div>

</section>

<section
id="history"
class="page">

<h2>Round History</h2>

<div id="historyTable"></div>

</section>

<section
id="analysis"
class="page">

<h2>Handicap Analysis</h2>

<div id="analysisContainer"></div>

</section>

<section
id="solver"
class="page">

<h2>Target Handicap Solver</h2>

<div class="solver-controls">

<label>

Player

<select id="solverPlayer">

<option>Mike</option>

<option>Johnny</option>

</select>

</label>

<label>

Target Handicap

<input
type="number"
step="0.1"
id="targetHandicap">

</label>

<button id="runSolver">

Calculate

</button>

</div>

<div id="solverResults"></div>

</section>

<section
id="timemachine"
class="page">

<h2>Time Machine</h2>

<div class="time-controls">

<button id="previousRound">

◀

</button>

<span id="timeRoundLabel">
Round
</span>

<button id="nextRound">

▶

</button>

</div>

<div id="timeMachineResults"></div>

</section>

<section
id="charts"
class="page">

<h2>Trend Charts</h2>

<canvas
id="trendChart"
width="1200"
height="500">
</canvas>

</section>

</main>

<div
id="loading"
class="loading hidden">

Loading...

</div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="csv.js"></script>
<script src="whs.js"></script>
<script src="handicap.js"></script>
<script src="dashboard.js"></script>
<script src="history.js"></script>
<script src="analysis.js"></script>
<script src="solver.js"></script>
<script src="timemachine.js"></script>
<script src="charts.js"></script>
<script src="ui.js"></script>
<script src="integration.js"></script>

<script src="app.js"></script>


</body>
</html>
